; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n4r2]
; Pinned deliberately, and NOT to the official platformio/espressif32.
;
; Unpinned, `espressif32` resolved on this machine to a leftover 2022-era fork
; (shining-man/platform-espressif32-t @ 2022.12.0) bundling Arduino-ESP32 core
; 2.0.5 / ESP-IDF 4.3. The Arduino IDE - which is what actually flashes this
; board over USB, and therefore what supplies the BOOTLOADER sitting in flash -
; is on ESP32 board package 3.3.11 / ESP-IDF 5.5.5. Handing an IDF-4.3 app
; image to an IDF-5.5 bootloader is why every OTA through /update wrote
; successfully, updated otadata, reported the new target partition back - and
; then booted the OLD slot anyway: the bootloader refused the freshly written
; image and silently fell back to app0 within the same reset (silently because
; bootloader logs go to UART0, not the USB CDC port).
;
; The official platformio/espressif32 is NOT a way out of that: even 7.0.1
; (the current release) still pins framework-arduinoespressif32 ~3.20017.0,
; i.e. Arduino core 2.0.17 / ESP-IDF 4.4 - the same wrong generation. The
; pioarduino fork is the maintained route to Arduino core 3.x on PlatformIO,
; and release 55.03.311 is Arduino 3.3.11 on ESP-IDF v5.5.5 - a byte-for-byte
; version match with the Arduino IDE board package installed on this machine
; (see ~/Library/Arduino15/packages/esp32/tools/esp32s3-libs/3.3.11/
; versions.txt: "esp-idf: v5.5.5"). USB-flashed and OTA-flashed images are now
; produced by the same toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n4r2
framework = arduino

; Adafruit NeoPixel for LED control; ArduinoJson replaces the hand-rolled
; indexOf/substring JSON parsing in web.cpp (fragile even at 10 fields, and
; about to grow with WiFi/MQTT/export-import fields).
lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.3
    bblanchon/ArduinoJson@^6
    knolleary/PubSubClient@^2.8

; Build flags
build_flags =
    -std=c++17
    -std=gnu++17
    -Wno-deprecated-declarations
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE
    -DCORE_DEBUG_LEVEL=4

; USB Configuration for ESP32-S3
board_build.usb_mode = hw_cdc
board_build.usb_product = "noiselight"

; Partition table (default OTA scheme, sized for this board's 4MB flash)
board_build.partitions = default.csv

; Monitor settings
monitor_speed = 115200

; Upload settings
upload_protocol = esptool
; upload_flags =
;     --before=esp32s3_reset
;     --after=hard_reset
;extra_scripts = post_upload.py

; Bakes WIFI_SSID/WIFI_PASSWORD from a gitignored .env file (see .env.example)
; into the firmware as first-boot NVS defaults - see load_env.py. Also
; copies the built .bin into firmware/ after every build - see
; copy_firmware_bin.py.
extra_scripts =
    pre:load_env.py
    post:copy_firmware_bin.py

; Same firmware as above, but flashed over WiFi via ArduinoOTA once the
; device is on the home network - no USB cable needed for routine updates.
; OTA only comes up after a successful STA connect (see NetworkService),
; so this env is useless against a device still on the AP fallback.
[env:esp32-s3-devkitc1-n4r2-ota]
; Must stay in lockstep with the USB env above - see the comment there for why
; the pin exists at all and why it isn't the official platformio/espressif32.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n4r2
framework = arduino
lib_deps = ${env:esp32-s3-devkitc1-n4r2.lib_deps}
build_flags = ${env:esp32-s3-devkitc1-n4r2.build_flags}
extra_scripts =
    pre:load_env.py
    post:copy_firmware_bin.py
board_build.usb_mode = hw_cdc
board_build.usb_product = "noiselight"
board_build.partitions = default.csv
monitor_speed = 115200
upload_protocol = espota
upload_port = noiselight.local
; This MUST match OTA_PASSWORD in include/config.h - PlatformIO can't read
; a C++ #define, so the two are separate literals with no build-time check
; keeping them in sync. If you change one, change both, or `pio run -t
; upload -e esp32-s3-devkitc1-n4r2-ota` will fail ArduinoOTA auth against
; a device that's already running the new password.
upload_flags =
    --auth=changeme-ota
