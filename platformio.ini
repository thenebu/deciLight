; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n4r2]
platform = espressif32
board = esp32-s3-devkitc1-n4r2
framework = arduino

; Adafruit NeoPixel for LED control; ArduinoJson replaces the hand-rolled
; indexOf/substring JSON parsing in web.cpp (fragile even at 10 fields, and
; about to grow with WiFi/MQTT/export-import fields).
lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.3
    bblanchon/ArduinoJson@^6

; Build flags
build_flags =
    -std=c++17
    -std=gnu++17
    -Wno-deprecated-declarations
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE
    -DCORE_DEBUG_LEVEL=4

; USB Configuration for ESP32-S3
board_build.usb_mode = hw_cdc
board_build.usb_product = "Noise Traffic Light"

; Partition table (default OTA scheme, sized for this board's 4MB flash)
board_build.partitions = default.csv

; Monitor settings
monitor_speed = 115200

; Upload settings
upload_protocol = esptool
; upload_flags =
;     --before=esp32s3_reset
;     --after=hard_reset
;extra_scripts = post_upload.py

; Same firmware as above, but flashed over WiFi via ArduinoOTA once the
; device is on the home network - no USB cable needed for routine updates.
; OTA only comes up after a successful STA connect (see NetworkService),
; so this env is useless against a device still on the AP fallback.
[env:esp32-s3-devkitc1-n4r2-ota]
platform = espressif32
board = esp32-s3-devkitc1-n4r2
framework = arduino
lib_deps = ${env:esp32-s3-devkitc1-n4r2.lib_deps}
build_flags = ${env:esp32-s3-devkitc1-n4r2.build_flags}
board_build.usb_mode = hw_cdc
board_build.usb_product = "Noise Traffic Light"
board_build.partitions = default.csv
monitor_speed = 115200
upload_protocol = espota
upload_port = noiselight.local
upload_flags =
    --auth=changeme-ota
